<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk? — Conversation Starter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ENTRY SCREEN -->
<section id="screen-intro" class="screen active">
  <div class="intro-wrap">
    <div class="intro-emoji">💬</div>
    <h1 class="intro-title">Talk<span class="intro-q">?</span></h1>
    <div class="lang-rows">
      <div class="lang-row">
        <button class="btn green huge" data-start="en">Yes</button>
        <button class="btn red huge" data-decline="en">No</button>
      </div>
      <div class="lang-row">
        <button class="btn green huge" data-start="de">Ja</button>
        <button class="btn red huge" data-decline="de">Nein</button>
      </div>
    </div>
  </div>
</section>

<!-- BYE SCREEN -->
<section id="screen-bye" class="screen">
  <div class="intro-wrap">
    <div class="intro-emoji bye-emoji">👋</div>
    <h1 class="bye-title" data-i18n="bye"></h1>
  </div>
</section>

<!-- SETUP SCREEN -->
<section id="screen-setup" class="screen">
  <header class="topbar">
    <button class="btn small ghost" id="btn-back-intro">←</button>
    <h2 data-i18n="setupTitle"></h2>
    <span class="spacer"></span>
  </header>

  <div class="setup-wrap">
    <h3 class="setup-label" data-i18n="topicsLabel"></h3>
    <div id="topic-board" class="topic-board"></div>

    <h3 class="setup-label"><span data-i18n="difficultyLabel"></span></h3>
    <div class="depth-slider">
      <div class="range-stops"><span></span><span></span><span></span><span></span><span></span></div>
      <input type="range" id="depth-slider" min="1" max="5" step="1" value="3" aria-label="depth">
      <div class="range-ticks"><span id="tick-min">😇</span><span id="tick-max">😱</span></div>
    </div>

    <p id="pool-count" class="pool-count"></p>
    <button class="btn green big" id="btn-to-wheel" data-i18n="toWheel"></button>
  </div>
</section>

<!-- WHEEL SCREEN -->
<section id="screen-wheel" class="screen">
  <header class="topbar">
    <button class="btn small ghost" id="btn-back-setup">←</button>
    <h2 data-i18n="wheelTitle"></h2>
    <span class="spacer"></span>
  </header>

  <div class="wheel-wrap">
    <div id="result-panel" class="result-panel invisible">
      <div class="result-head">
        <span class="result-topic" id="result-topic"></span>
        <span class="result-depth" id="result-depth"></span>
      </div>
      <p class="result-question" id="result-question"></p>
      <div class="result-actions">
        <button class="btn green small" id="btn-next-question" data-i18n="nextQuestion"></button>
      </div>
    </div>

    <div class="wheel-area">
    <div class="wheel-pointer"></div>
    <div id="wheel-container" class="wheel-container">
      <svg id="wheel-svg" viewBox="0 0 300 300" aria-hidden="true"></svg>
      <button id="btn-spin" class="spin-btn" aria-label="Spin the wheel">
        <svg viewBox="0 0 100 100" class="spin-icon"><path d="M50 15a35 35 0 1 1-33.2 24" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><path d="M8 26l9.8 15 15-9.8z" fill="currentColor"/></svg>
      </button>
    </div>

    </div>
    <p id="wheel-empty" class="wheel-empty hidden" data-i18n="wheelEmpty"></p>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
